name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests mock every provider call; the key only needs to exist so config
      # can resolve without a developer machine's ~/.env (the bug this CI hit).
      GNANI_API_KEY: ci-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PyTorch (CPU wheel)
        # Resolve the CPU wheel explicitly. With --extra-index-url pip can pick
        # the much larger default wheel and stall on a slow mirror.
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 60 --retries 3 --index-url https://download.pytorch.org/whl/cpu "torch==2.12.1+cpu"

      - name: Install dependencies
        run: |
          pip install --timeout 60 --retries 5 -r requirements-dev.txt

      - name: Install ffmpeg (runtime dependency)
        # Bounded: the runner's apt mirror stalled here for 20 minutes once and cancelled the job.
        timeout-minutes: 5
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          }
          ffmpeg -version | head -1

      - name: Config resolves without a developer ~/.env
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import config; assert config.GNANI_API_KEY == 'ci-test-placeholder'; print('config OK: key resolved from environment')"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3

      - name: Lint (ruff)
        run: ruff check .

      - name: Type/byte-compile check
        run: python -m py_compile server.py src/*.py tests/*.py

      - name: Tests (coverage gate ≥ 80%)
        run: python -m pytest tests/ -q --cov=src --cov=server --cov-report=term-missing

      - name: Retrieval and confidence regression gate
        # Re-runs the real retriever over four labeled sets and fails if recall or
        # refusal quality drops beyond tolerance. Baseline: evals/baseline.json.
        run: python scripts/eval_retrieval.py --check evals/baseline.json

      - name: Secret scan (gitleaks)
        # Scan every commit explicitly. The marketplace action derives a
        # `<base>^..HEAD` range from the push event, which is invalid when the
        # base is a root commit (e.g. after a history rewrite). The tarball is
        # checksum-verified so a compromised release cannot run in CI.
        run: |
          set -euo pipefail
          version=8.24.3
          sha256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLo /tmp/gitleaks.tar.gz "$url"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact -v --exit-code=2 --log-opts="--all"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: siddha:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run the image and wait for readiness
        # The image is only useful if it starts, loads the baked model and serves
        # the page. /api/ready turns 200 once the warm-up thread has the model and
        # index in memory; /api/health checks the corpus, key and ffmpeg.
        run: |
          set -euo pipefail
          docker run -d --name siddha-ci -p 7860:7860 \
            -e GNANI_API_KEY=ci-test-placeholder siddha:ci
          trap 'docker logs siddha-ci || true; docker rm -f siddha-ci' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7860/api/ready >/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then
            echo "container never became ready"
            docker logs siddha-ci
            exit 1
          fi
          curl -fsS http://localhost:7860/api/ready
          curl -fsS http://localhost:7860/api/health
          curl -fsS http://localhost:7860/ | grep -q 'Siddha'
          docker stop siddha-ci
