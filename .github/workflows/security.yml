name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt pip-audit

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit --strict --progress-spinner=off || true   # advisory first; fail after triage

      - name: Secret scan (gitleaks)
        # Explicit full-history scan; avoids the action's `<base>^..HEAD`
        # range, which breaks when the base is a root commit.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact -v --exit-code=2 --log-opts="--all"
