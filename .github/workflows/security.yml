name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt pip-audit

      - name: Dependency vulnerability audit (pip-audit)
        # Fail on any advisory that is not explicitly accepted below. The three
        # ignores are tracked with their upgrade path in docs/decisions.md.
        run: |
          pip-audit -r requirements.txt --strict --progress-spinner=off \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w

      - name: Secret scan (gitleaks)
        # Explicit full-history scan; avoids the action's `<base>^..HEAD`
        # range, which breaks when the base is a root commit. The tarball is
        # checksum-verified so a compromised release cannot run in CI.
        run: |
          set -euo pipefail
          version=8.24.3
          sha256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLo /tmp/gitleaks.tar.gz "$url"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact -v --exit-code=2 --log-opts="--all"
