name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Dependency vulnerability audit (pip-audit)
        # The runtime installs torch 2.12.1+cpu from the PyTorch CPU index. That
        # local-version suffix is not published on PyPI, so pip-audit cannot map
        # the installed build to advisories. Audit the same source release
        # (torch 2.12.1) resolved from PyPI instead: strip index overrides from
        # the requirements file and keep every pin. The three ignores are
        # tracked with their upgrade path in docs/decisions.md.
        run: |
          set -euo pipefail
          grep -vE '^\s*(--extra-index-url|--index-url|--find-links|-f)(\s|=|$)' requirements.txt \
            > "$RUNNER_TEMP/requirements-audit.txt"
          pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --strict --progress-spinner=off \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Secret scan (gitleaks)
        # Explicit full-history scan; avoids the action's `<base>^..HEAD`
        # range, which breaks when the base is a root commit. Install from
        # source to avoid flaky release-tarball downloads.
        run: |
          set -euo pipefail
          GOBIN=/usr/local/bin go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks version || true
          gitleaks detect --source . --redact -v --exit-code=2 --log-opts="--all"
