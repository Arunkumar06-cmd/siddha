<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f2e7" />
<meta name="color-scheme" content="light" />
<title>Siddha — Voice Guide for Indian Scholarships</title>
<style>
  /* Paper & ink: a LaTeX-calm page for reading and speaking.
     Deep petrol teal (#0f4c5c) — calm, trust, focus (blue-green family).
     Warm ivory (#f7f2e7) lowers halation vs pure white for long reading. */
  :root {
    --paper: #f7f2e7;
    --panel: #fffdf8;
    --ink: #21242a;
    --muted: #6b6557;
    --hairline: #d9d2bf;
    --accent: #0f4c5c;
    --accent-hover: #14607a;
    --transcript: #ede8da;
    --source: #f3efe1;
    --danger: #a63a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    color: var(--ink); background: var(--paper);
    background-image: radial-gradient(1100px 620px at 50% -12%, #fdfbf3, var(--paper));
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', 'New York', Georgia, 'Times New Roman', serif;
    font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center; padding: 26px 16px 14px;
    border-top: 3px double var(--ink); border-bottom: 1px solid var(--hairline);
  }
  h1 { margin: 0 0 4px; font-size: clamp(1.55rem, 5vw, 2.15rem); font-weight: 600;
       letter-spacing: .015em; color: var(--ink); }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: .86rem; font-style: italic; }
  main {
    width: min(660px, 94vw); margin: auto; background: var(--panel);
    border: 1px solid var(--hairline); border-radius: 10px;
    padding: 24px 26px; box-shadow: 0 10px 34px -14px rgba(33, 36, 42, .35);
  }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0 4px; }
  #mic {
    width: 100px; height: 100px; border-radius: 50%; border: none; cursor: pointer;
    display: grid; place-items: center; color: #fdfaf0; background: var(--accent);
    box-shadow: 0 14px 28px -12px rgba(15, 76, 92, .55);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  #mic:hover { transform: translateY(-2px); background: var(--accent-hover); box-shadow: 0 18px 32px -12px rgba(15, 76, 92, .6); }
  #mic:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 4px; }
  #mic[aria-pressed="true"] { background: #a4502f; animation: pulse 1.25s infinite; box-shadow: 0 0 0 0 rgba(164, 80, 47, .45); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(164, 80, 47, .45); } 80% { box-shadow: 0 0 0 18px rgba(164, 80, 47, 0); } 100% { box-shadow: 0 0 0 0 rgba(164, 80, 47, 0); } }
  #status { min-height: 1.5em; color: var(--muted); font-size: .9rem; font-style: italic; text-align: center; }
  #status.error { color: var(--danger); font-style: normal; }
  .bubble { border-radius: 8px; padding: 14px 16px; margin: 12px 0 0; line-height: 1.62; display: none; font-size: 1.02rem; }
  #transcript { background: var(--transcript); border: 1px solid var(--hairline); color: #3d392f; font-size: .92rem; }
  #reply { background: var(--panel); border: 1px solid var(--hairline); border-left: 3px solid var(--accent); font-size: 1.06rem; color: var(--ink); }
  #reply strong { color: var(--accent); font-variant: small-caps; letter-spacing: .08em; font-weight: 600; }
  #sources { font-size: .78rem; color: var(--muted); display: none; margin-top: 10px; }
  .src { display: flex; justify-content: space-between; gap: 10px; background: var(--source);
         border: 1px solid var(--hairline); border-radius: 6px; padding: 6px 10px; margin: 5px 0; }
  .src b { color: var(--ink); font-weight: 600; }
  .src span { color: var(--accent); }
  footer {
    color: var(--muted); font-size: .78rem; font-style: italic; text-align: center;
    padding: 10px 12px 22px; border-top: 1px solid var(--hairline); width: min(660px, 94vw); margin: 0 auto;
  }
  a { color: var(--accent); text-decoration-color: #b9c6bb; }
  a:hover { color: var(--accent-hover); }
  ::selection { background: #d7e4dc; }
</style>
</head>
<body>
<header>
  <h1>Siddha <span>✦</span> Voice Guide to Scholarships</h1>
  <div class="tag">Speak naturally — it answers with the exact NSP scholarships, documents and dates</div>
</header>
<main>
  <div class="mic-wrap">
    <button id="mic" aria-pressed="false" aria-label="Start recording">
      <svg viewBox="0 0 24 24" width="42" height="42" aria-hidden="true" focusable="false">
        <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
        <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.5M9 20.5h6"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="status" role="status">Tap once and ask your question</div>
    <audio id="player" autoplay></audio>
  </div>
  <div id="transcript" class="bubble"></div>
  <div id="reply" class="bubble"></div>
  <div id="sources"></div>
</main>
<footer>Demo, not legal advice. Verify on <a href="https://www.scholarships.gov.in">scholarships.gov.in</a> · Built on Gnani Prisma/Timbre</footer>

<script>
const mic = document.getElementById('mic'), statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript'), replyEl = document.getElementById('reply');
const sourcesEl = document.getElementById('sources'), player = document.getElementById('player');
const MIME = ['audio/webm','audio/mp4','audio/wav'].find(m => MediaRecorder.isTypeSupported(m)) || '';
let recorder = null, chunks = [];

function setStatus(msg, isErr=false){
  statusEl.textContent = msg; statusEl.classList.toggle('error', isErr);
}
function renderSources(sources){
  sourcesEl.style.display = 'block';
  sourcesEl.textContent = '';
  const lbl = document.createElement('div');
  lbl.textContent = 'Sources (1,142 schemes):';
  sourcesEl.appendChild(lbl);
  for (const s of sources) {
    const row = document.createElement('div');
    row.className = 'src';
    const b = document.createElement('b');
    b.textContent = s.name;
    const sc = document.createElement('span');
    sc.textContent = s.score ?? 'official';
    row.append(b, sc);
    sourcesEl.appendChild(row);
  }
}
mic.addEventListener('click', async () => {
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    recorder = new MediaRecorder(stream, MIME ? {mimeType: MIME} : undefined);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      mic.setAttribute('aria-pressed','false'); mic.setAttribute('aria-label','Start recording');
      setStatus('Thinking…');
      const blob = new Blob(chunks, {type: MIME || 'audio/webm'});
      const fd = new FormData(); fd.append('audio', blob, 'q.webm');
      try {
        const r = await fetch('/api/ask_audio', {method:'POST', body: fd});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Server error');
        transcriptEl.style.display='block'; transcriptEl.textContent = 'You: ' + (j.transcript || '(no speech detected)');
        replyEl.style.display='block';
        replyEl.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = 'Siddha';
        const span = document.createElement('span');
        span.textContent = ' — ' + j.reply;
        replyEl.append(strong, span);
        renderSources(j.sources || []);
        if (j.audio_wav_b64) {
          player.src = 'data:audio/wav;base64,' + j.audio_wav_b64;
          await player.play().catch(()=>{});
        }
        setStatus('Done — tap the mic and ask again.');
      } catch (err) {
        setStatus('Problem: ' + err.message + '. Try again in a quiet place.', true);
      } finally { recorder = null; }
    };
    recorder.start();
    mic.setAttribute('aria-pressed','true'); mic.setAttribute('aria-label','Stop recording');
    setStatus('Listening… tap to stop.');
  } catch (err) {
    setStatus('Microphone blocked. Allow mic access in the browser.', true);
  }
});
</script>
</body>
</html>
